[project]
name = "reference-checker"
version = "0.1.0"
description = "Desktop application for verifying bibliographic references in DOCX manuscripts."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Kutay Uzun" }
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

ignore = []

[tool.pytest.ini_options]
testpaths = [
    "tests"
]

pythonpath = [
    "src"
]

addopts = "-v"

[tool.coverage.run]
source = [
    "src"
]

[tool.coverage.report]
show_missing = true
skip_covered = false