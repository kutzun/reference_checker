name: Build macOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller ReferenceChecker-mac.spec --clean

      - name: Create DMG
        run: |
          hdiutil create -volname "Reference Checker 1.2.1" \
            -srcfolder "dist/Reference Checker.app" \
            -ov -format UDZO \
            ReferenceChecker_v121.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ReferenceChecker-v1.2.1-macOS
          path: ReferenceChecker_v121.dmg